<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isi Tas Erik</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e7e2;--ink:#161616;--paper:#f6efd9;--hand:'Caveat','Segoe Script',cursive;--ui:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--ui);background:var(--bg);overflow:hidden;transition:background 1.2s}
body.open{background:#000}

/* ===== TAMPILAN LUAR: TAS ===== */
#outside{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .9s,transform 1.2s}
body.open #outside{opacity:0;transform:scale(2.2);pointer-events:none}
#outside svg{width:min(86vw,52vh,380px);height:auto;touch-action:none}
#hint{font-family:var(--hand);font-size:26px;color:#444}
#pull{cursor:grab}
#pull:active{cursor:grabbing}

/* ===== TAMPILAN DALAM TAS ===== */
#inside{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;opacity:0;pointer-events:none;transition:opacity 1.4s .5s;
  background:radial-gradient(ellipse at 50% 0%,#1d1d1d 0%,#050505 55%,#000 100%)}
body.open #inside{opacity:1;pointer-events:auto}
#inside h1{font-family:var(--hand);font-weight:500;font-size:clamp(28px,5vw,44px);color:#e9e4d6;text-align:center}
#inside p.sub{color:#8d8a82;font-size:14px;margin-top:-18px}
#items{display:flex;flex-wrap:wrap;gap:clamp(16px,4vw,44px);justify-content:center;align-items:flex-end;max-width:960px}
.item{background:none;border:0;cursor:pointer;width:clamp(110px,22vw,170px);transition:transform .25s;filter:drop-shadow(0 10px 14px rgba(0,0,0,.8))}
.item svg{width:100%;height:auto;display:block}
.item:hover,.item:focus-visible{transform:translateY(-10px) rotate(-2deg);outline:none}
.item:focus-visible{filter:drop-shadow(0 0 8px #e9e4d6)}
.item span{display:block;margin-top:8px;font-family:var(--hand);font-size:22px;color:#cfcabb}

.stack{position:relative;width:100%;aspect-ratio:4/3}
.pc{position:absolute;inset:0;background:#fffdf6;padding:6px;border-radius:2px;box-shadow:0 3px 8px rgba(0,0,0,.6);transition:transform .3s}
.pc div{width:100%;height:100%;background:#2b2b2b center/cover no-repeat}
.item:hover .pc:nth-last-child(2){transform:rotate(-12deg) translateX(-8px)!important}
.item:hover .pc:nth-last-child(1){transform:rotate(9deg) translateX(8px)!important}
#mute{position:fixed;top:14px;right:14px;z-index:5;background:#1b1b1b;color:#ddd;border:1px solid #333;border-radius:20px;padding:8px 14px;font:700 13px var(--ui);cursor:pointer;display:none}
body.open #mute{display:block}

/* ===== MODAL ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.box{width:min(94vw,560px);position:relative}
.close{position:absolute;top:-44px;right:0;background:none;border:0;color:#ddd;font-size:30px;cursor:pointer}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#ddd}
.nav button{background:#222;color:#eee;border:1px solid #444;border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
.dots{font-family:var(--hand);font-size:22px}

/* foto 4:3 */
.photo{aspect-ratio:4/3;background:#fff;padding:12px 12px 12px;border-radius:3px;box-shadow:0 12px 30px #000}
.photo .img{width:100%;height:100%;background:#2b2b2b center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#777;font-size:14px}
.cap{font-family:var(--hand);font-size:24px;color:#e9e4d6;text-align:center;margin-top:12px;min-height:30px}

/* kertas catatan */
.note{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 33px,#c9bf9f 33px 34px);color:#2d2a22;border-radius:4px;padding:20px 24px;min-height:320px;max-height:62vh;overflow:auto;box-shadow:0 12px 30px #000;font-family:var(--hand);font-size:26px;line-height:34px;white-space:pre-line;border-left:6px solid #b24a3a}
.note b{display:block;font-size:30px;margin-bottom:4px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ============ TAS (LUAR) ============ -->
<main id="outside">
  <svg id="bag" viewBox="0 0 400 470" role="img" aria-label="Tas ransel hitam">
    <!-- tali & handle -->
    <path d="M165 62 q0-40 18-40 h34 q18 0 18 40" fill="none" stroke="#111" stroke-width="16" stroke-linecap="round"/>
    <path d="M56 300 q-34 6-34 40 q0 20 24 22" fill="none" stroke="#151515" stroke-width="16" stroke-linecap="round"/>
    <path d="M344 300 q34 6 34 40 q0 20-24 22" fill="none" stroke="#151515" stroke-width="16" stroke-linecap="round"/>
    <!-- badan -->
    <path d="M110 86 Q200 50 290 86 Q340 120 346 200 L356 400 Q356 450 300 452 L100 452 Q44 450 44 400 L54 200 Q60 120 110 86Z" fill="#171717"/>
    <path d="M70 200 Q75 140 120 112" fill="none" stroke="#242424" stroke-width="3"/>
    <!-- kantong depan -->
    <path d="M82 300 Q82 270 112 268 L288 268 Q318 270 318 300 L322 420 Q322 440 300 440 L100 440 Q78 440 78 420Z" fill="#1d1d1d" stroke="#2b2b2b" stroke-width="2"/>
    <path d="M82 300 Q200 330 318 300" fill="none" stroke="#2b2b2b" stroke-width="2"/>
    <circle cx="106" cy="352" r="5" fill="#333"/>
    <!-- gesper samping -->
    <rect x="36" y="230" width="22" height="14" rx="4" fill="#0b0b0b"/><rect x="342" y="230" width="22" height="14" rx="4" fill="#0b0b0b"/>
    <!-- dalam terbuka (celah resleting) -->
    <path id="gap" d="M120 150 Q200 102 280 150" fill="none" stroke="#000" stroke-width="0" stroke-linecap="round"/>
    <!-- resleting -->
    <path id="zip" d="M120 150 Q200 102 280 150" fill="none" stroke="#5a5a5a" stroke-width="5" stroke-dasharray="2 3" stroke-linecap="round"/>
    <g id="pull" tabindex="0" role="button" aria-label="Tarik resleting">
      <rect x="-9" y="-6" width="18" height="12" rx="3" fill="#0d0d0d" stroke="#777" stroke-width="1.5"/>
      <rect x="-3.5" y="4" width="7" height="22" rx="3.5" fill="#0d0d0d" stroke="#777" stroke-width="1.5"/>
      <circle r="26" fill="transparent"/>
    </g>
  </svg>
  <div id="hint">tarik resletingnya ke kanan ✦</div>
</main>

<!-- ============ DALAM TAS ============ -->
<section id="inside" aria-label="Isi tas">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div id="items">

    <!-- 1. LEMBAR FOTO (menampilkan foto asli dari CONFIG.photos) -->
    <button class="item" id="itPhoto" aria-label="Buka lembar foto">
      <div class="stack" id="stack"></div>
      <span>klo kangen liat ini aja</span>
    </button>

    <!-- 2. BUKU CATATAN -->
    <button class="item" id="itBook" aria-label="Buka buku catatan">
      <svg viewBox="0 0 160 190">
        <rect x="26" y="10" width="112" height="168" rx="6" fill="#d9d2bf"/>
        <rect x="20" y="6" width="112" height="168" rx="6" fill="#2f3b35"/>
        <rect x="20" y="6" width="14" height="168" rx="4" fill="#212a26"/>
        <rect x="108" y="6" width="9" height="168" fill="#a9442f"/>
        <!-- stiker roda gigi -->
        <g transform="translate(70 52)"><circle r="22" fill="#e9b949"/><g fill="#e9b949"><rect x="-4" y="-29" width="8" height="12"/><rect x="-4" y="17" width="8" height="12"/><rect x="-29" y="-4" width="12" height="8"/><rect x="17" y="-4" width="12" height="8"/></g><circle r="9" fill="#2f3b35"/></g>
        <!-- stiker piston -->
        <g transform="rotate(-12 60 112)"><rect x="40" y="96" width="42" height="30" rx="5" fill="#c8c8c8"/><rect x="58" y="126" width="6" height="22" fill="#9a9a9a"/><circle cx="61" cy="150" r="5" fill="#9a9a9a"/><rect x="40" y="104" width="42" height="3" fill="#777"/><rect x="40" y="112" width="42" height="3" fill="#777"/></g>
        <!-- stiker label -->
        <g transform="rotate(8 96 138)"><rect x="76" y="126" width="34" height="22" rx="3" fill="#d8472f"/><text x="93" y="141" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="Nunito,sans-serif">T. MESIN</text></g>
        <!-- stiker bintang & kunci inggris -->
        <path d="M100 30 l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" fill="#6fb3d9"/>
        <g transform="rotate(35 100 100)"><rect x="97" y="82" width="6" height="34" rx="3" fill="#bfbfbf"/><circle cx="100" cy="82" r="8" fill="#bfbfbf"/><rect x="97" y="72" width="6" height="9" fill="#2f3b35"/></g>
      </svg>
      <span>catatan buat erik sayang</span>
    </button>

    <!-- 3. OBAT -->
    <button class="item" id="itMed" aria-label="Buka catatan obat">
      <svg viewBox="0 0 130 170">
        <rect x="26" y="8" width="78" height="30" rx="6" fill="#e9e9e9"/>
        <rect x="26" y="30" width="78" height="8" fill="#cfcfcf"/>
        <rect x="20" y="36" width="90" height="124" rx="14" fill="#d9772b"/>
        <rect x="20" y="36" width="90" height="124" rx="14" fill="url(#shine)" opacity=".25"/>
        <rect x="28" y="64" width="74" height="70" rx="6" fill="#fffaf0"/>
        <rect x="55" y="74" width="20" height="46" fill="#c83a3a"/><rect x="42" y="87" width="46" height="20" fill="#c83a3a"/>
        <rect x="36" y="124" width="58" height="3" fill="#bbb"/>
        <defs><linearGradient id="shine"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      </svg>
      <span>obat buat mamas</span>
    </button>


  </div>
</section>

<button id="mute" aria-label="Bisukan musik">🎵 musik: nyala</button>

<!-- ============ MODAL FOTO ============ -->
<div class="modal" id="mPhoto" role="dialog" aria-modal="true">
  <div class="box">
    <button class="close" data-close aria-label="Tutup">×</button>
    <div class="photo"><div class="img" id="phImg"></div></div>
    <div class="cap" id="phCap"></div>
    <div class="nav"><button id="phPrev" aria-label="Foto sebelumnya">‹</button><span class="dots" id="phDots"></span><button id="phNext" aria-label="Foto berikutnya">›</button></div>
  </div>
</div>

<!-- ============ MODAL CATATAN (dipakai buku & obat) ============ -->
<div class="modal" id="mNote" role="dialog" aria-modal="true">
  <div class="box">
    <button class="close" data-close aria-label="Tutup">×</button>
    <div class="note" id="noteBody"></div>
    <div class="nav"><button id="nPrev" aria-label="Halaman sebelumnya">‹</button><span class="dots" id="nDots"></span><button id="nNext" aria-label="Halaman berikutnya">›</button></div>
  </div>
</div>

<script>
/* =====================================================
   ✏️ EDIT DI SINI SAJA — semua isi ucapan ada di CONFIG
   ===================================================== */
const CONFIG = {
  song: "lagu.mp3",                       // taruh file lagu satu folder dengan index.html
  title: "Isi tas ini buat mamas erik",
  subtitle: "klik barang-barangnya ya",

  // Lembar foto (rasio 4:3). Tambah objek baru untuk menambah slide.
  photos: [
    { src: "foto11.jpg", caption: "aloo sayang, ini zahra, bahagia slalu yah🥰" },
    { src: "foto22.jpg", caption: "hati-hati slalu dimanapun yah🤗" },
    { src: "foto33.jpg", caption: "SEMANGATTT MAMASSSS🥰💕" }
  ],

  // Buku catatan. Tambah objek baru untuk menambah lembar.
  book: [
    { heading: "Di inget loh!😡", text: "Mamas disana jangan lupa makan,\n jangan lupa sholat, \n jangan lupa istirahat, \n klo cape jangan dipaksa,mas juga berhak istirahat, \n disana jangan ngebut, tetap hati- hati di jalan." },
    { heading: "Kalimat pengingat buat mas klo lagi down", text: "Ya allah aku takut tapi aku punya dirimu, \n Ya allah aku khawatir tapi aku punya dirimu, \n Ya allah aku gelisah tapi aku punya dirimu,  \n Ya allah aku kecewa tapi aku punya dirimu,  \n Ya allah aku sedih tapi aku punya dirimu, \n Ya allah aku marah tapi aku punya dirimu,  \n Ya allah aku gagal tapi aku punya dirimu,  \n Ya allah aku kesal tapi aku punya dirimu, \n Ya allah aku bimbang tapi aku punya dirimu, \n Ya allah aku ingin menyerah tapi sekali lagi, aku masih punya dirimu." },
    { heading: "inget ini yah sayang", text: "semua akan berlalu, \n semua akan baik-baik saja, \n ini cuma dunia, \n Allah lebih besar dari kekhawatiran kita" },
    { heading: "Mas, adek pengen ngomong", text: "hubungan kita ga akan selalu baik dan itu wajar :), \n pasti ada saat-saat dimana kita berantem, saling kesal satu sama lain, tapi itu ga apa, itu wajar. \n mas punya ego, adek juga punya ego, kita sama-sama punya ego karena kita manusia, klo mamas terkadang merasa egonya tinggi juga nda apa yah sayang, aku paham dan sama sekali tidak mempersalahkan hal tersebut. \n yang terpenting adalah bagaimana komunikasi kita buat menemukan solusi dari masalah tersebut, \n aku bukan cuma berharap, tapi aku juga pengen komunikasi menjadi kunci untuk tiap permasalahan kita bersama " }
  ],

  // Catatan dari obat. Tambah objek baru untuk menambah lembar.
  medicine: [
    { heading: "RESEP OBAT", text: "No minum alkohol, \n kurangin rokok/vape nya, \n Sholat 5x Sehari, \n Peregangan tiap bangun tidur, \n Sedekah, \n Jangan telat maKan, \n Istirahat yang cukup, \n ada masalah? cerita! jgn dipendam, \n ga ada masalah? tetep komunikasi" }
  ]
};

/* ================== KODE ================== */
const $ = s => document.querySelector(s);
const audio = new Audio(CONFIG.song); audio.loop = true;
$('#title').textContent = CONFIG.title; $('#sub').textContent = CONFIG.subtitle;

/* ---- Resleting ---- */
const zip = $('#zip'), pull = $('#pull'), gap = $('#gap'), bag = $('#bag');
const L = zip.getTotalLength(); let prog = 0, opened = false, dragging = false;
function setProg(p){
  prog = Math.max(0, Math.min(1, p));
  const pt = zip.getPointAtLength(prog * L);
  pull.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
  gap.setAttribute('stroke-width', 14);
  gap.setAttribute('stroke-dasharray', `${prog*L} ${L}`);
  gap.setAttribute('stroke', '#000');
  gap.style.filter = 'drop-shadow(0 0 3px #333)';
  if(prog >= .97 && !opened) openBag();
}
function progFromEvent(e){
  const r = bag.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 400;
  return (x - 120) / 160;
}
pull.addEventListener('pointerdown', e => { dragging = true; pull.setPointerCapture(e.pointerId); $('#hint').style.opacity = 0; });
pull.addEventListener('pointermove', e => { if(dragging) setProg(progFromEvent(e)); });
pull.addEventListener('pointerup', () => { dragging = false; if(!opened){ if(prog > .15) animateTo(1); else animateTo(0); } });
pull.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); animateTo(1); } });
function animateTo(t){
  const start = prog, t0 = performance.now(), dur = 700 * Math.abs(t - start) + 100;
  (function f(now){ const k = Math.min(1, (now - t0) / dur); setProg(start + (t - start) * k); if(k < 1 && !opened) requestAnimationFrame(f); })(t0);
}
function openBag(){
  opened = true;
  audio.play().catch(() => { $('#mute').textContent = '🎵 musik: ketuk untuk menyalakan'; });
  setTimeout(() => document.body.classList.add('open'), 350);
}
setProg(0);

/* ---- Tombol musik ---- */
$('#mute').onclick = () => {
  if(audio.paused){ audio.play(); $('#mute').textContent = '🎵 musik: nyala'; }
  else { audio.pause(); $('#mute').textContent = '🔇 musik: mati'; }
};

/* ---- Modal ---- */
function show(id){ $(id).classList.add('show'); }
function hideAll(){ document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); }
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if(e.target === m || e.target.hasAttribute('data-close')) hideAll(); }));
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideAll(); });

/* Pager generik: dipakai foto & catatan */
function pager(data, render, prevBtn, nextBtn, dots){
  let i = 0;
  const draw = () => {
    render(data[i], i);
    $(prevBtn).disabled = i === 0; $(nextBtn).disabled = i === data.length - 1;
    $(dots).textContent = `${i + 1} / ${data.length}`;
  };
  $(prevBtn).onclick = () => { if(i > 0){ i--; draw(); } };
  $(nextBtn).onclick = () => { if(i < data.length - 1){ i++; draw(); } };
  return { open(){ i = 0; draw(); }, next(){ $(nextBtn).click(); }, prev(){ $(prevBtn).click(); } };
}

/* Tumpukan foto di dalam tas = foto asli */
(function(){
  const rot = [0, -7, 6], st = $('#stack');
  CONFIG.photos.slice(0,3).map((p,i)=>({p,r:rot[i]??0})).reverse().forEach(({p,r},k,arr)=>{
    const c = document.createElement('div'); c.className='pc'; c.style.transform = `rotate(${r}deg)`;
    const d = document.createElement('div'); d.style.backgroundImage = `url("${p.src}")`;
    c.appendChild(d); st.appendChild(c);
  });
})();

/* Foto */
const photoPager = pager(CONFIG.photos, p => {
  const el = $('#phImg'); el.style.backgroundImage = `url("${p.src}")`; el.textContent = '';
  const probe = new Image(); probe.onerror = () => { el.style.backgroundImage = 'none'; el.textContent = p.src + ' belum ditemukan'; }; probe.src = p.src;
  $('#phCap').textContent = p.caption || '';
}, '#phPrev', '#phNext', '#phDots');
$('#itPhoto').onclick = () => { photoPager.open(); show('#mPhoto'); };

/* Swipe foto */
let sx = null; const pb = $('#mPhoto .box');
pb.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
pb.addEventListener('touchend', e => { if(sx === null) return; const d = e.changedTouches[0].clientX - sx; if(Math.abs(d) > 40){ d < 0 ? photoPager.next() : photoPager.prev(); } sx = null; });
document.addEventListener('keydown', e => { if($('#mPhoto').classList.contains('show')){ if(e.key === 'ArrowRight') photoPager.next(); if(e.key === 'ArrowLeft') photoPager.prev(); } });

/* Catatan (buku & obat) */
let noteData = CONFIG.book, notePager;
function makeNotePager(){
  notePager = pager(noteData, n => { $('#noteBody').innerHTML = ''; const b = document.createElement('b'); b.textContent = n.heading || ''; $('#noteBody').append(b, document.createTextNode(n.text)); }, '#nPrev', '#nNext', '#nDots');
  notePager.open();
}
$('#itBook').onclick = () => { noteData = CONFIG.book; makeNotePager(); show('#mNote'); };
$('#itMed').onclick = () => { noteData = CONFIG.medicine; makeNotePager(); show('#mNote'); };
</script>
</body>
</html>
